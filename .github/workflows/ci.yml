name: ci

on:
  push:
    # `ci` is where a publish candidate goes first: `git push origin public:ci`, wait for green,
    # then `public:main`. Nothing else than the Mac has compiled the tree before that.
    branches: [main, master, ci]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  crate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The suite ran on Linux alone, and neither platform that ships a package is Linux.
  elsewhere:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - run: cargo test

  # The packages are musl, x86_64 for a DS218+ and aarch64 for the armv8 models, and the suite
  # above runs against glibc. Native runners for both, and the linker the release builds with.
  musl:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: ${{ matrix.target }}
          build-warnings: allow
      - uses: mlugg/setup-zig@v2
      - run: cargo install cargo-zigbuild --locked
      # `cargo zigbuild` is the build alone; the other cargo verbs go through the binary itself.
      - run: cargo-zigbuild test --target ${{ matrix.target }}

  # The server listens on every interface, parses SOAP from any device on the network and tags
  # from any file in the music folder: what the dependencies are known to get wrong matters.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # The gate the standards ask for, so the figure cannot drift down unnoticed.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --fail-under-lines 85

  # The parsers that take hostile input build as fuzz targets; a target that no longer compiles
  # is caught here, and `cargo fuzz run <target>` is a local pass, not a CI one.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@cargo-fuzz
      - run: cargo fuzz build
        working-directory: fuzz

  page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      # The built page is committed so a clone needs no node. A build that changes it means the
      # commit carries yesterday's page.
      - run: git diff --exit-code -- assets/web
