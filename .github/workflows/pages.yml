name: pages

# The site changes without a release: it is rebuilt around the package the latest release carries,
# so the catalogue Package Center reads keeps pointing at it.
on:
  push:
    branches: [main]
    paths:
      - "packaging/pages/**"
      - "tools/package-pages.sh"
      - "tools/package-index.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: The site around the package of the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release view --json tagName --jq .tagName)"
          gh release download "$tag" --pattern '*.spk' --dir dist
          tools/package-pages.sh "$(ls dist/kantele-*.spk)" "$tag"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages
      - id: deploy
        uses: actions/deploy-pages@v5
